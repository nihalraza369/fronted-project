<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Website Carousel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
    }

    .navbar {
      position: fixed;
      left: 0;
      top: 0;
      width: 200px;
      height: 100vh;
      background-color: #fff;
      border-right: 1px solid #ddd;
      box-shadow: 2px 0px 5px rgba(0, 0, 0, 0.1);
      padding: 20px 0;
    }

    .navbar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .navbar ul li {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      cursor: pointer;
      color: #333;
      transition: all 0.3s;
    }

    .navbar ul li i {
      margin-right: 10px;
      font-size: 18px;
    }

    .navbar ul li:hover {
      background-color: #ffcc80;
      color: #fff;
    }

    /* Right-side image carousel */
    .carousel {
      margin-left: 220px;
      width: calc(100% - 220px);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background-color: #f0f0f0;
    }

    .carousel img {
      width: 400px;
      height: 300px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
      position: absolute;
      transform: translateX(100%);
      transition: transform 1s ease-in-out;
    }

    /* Control buttons */
    .carousel .prev, .carousel .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      color: #333;
      background-color: rgba(255, 255, 255, 0.7);
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 50%;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
    }

    .carousel .prev {
      left: 20px;
    }

    .carousel .next {
      right: 20px;
    }

    /* Active image */
    .carousel img.active {
      transform: translateX(0);
    }
  </style>
</head>
<body>

  <!-- Left Navbar -->
  <div class="navbar">
    <ul>
      <li><i class="fas fa-home"></i> Home</li>
      <li><i class="fas fa-info-circle"></i> About</li>
      <li><i class="fas fa-fire"></i> Trending</li>
      <li><i class="fas fa-utensils"></i> Food Category</li>
      <li><i class="fas fa-glass-martini-alt"></i> Juice</li>
      <li><i class="fas fa-phone-alt"></i> Contact</li>
    </ul>
  </div>

  <!-- Image Carousel -->
  <div class="carousel">
    <button class="prev"><i class="fas fa-chevron-left"></i></button>
    <button class="next"><i class="fas fa-chevron-right"></i></button>
    <img src="pasta.jpg" alt="Dish 1" class="active">
    <img src="nudle.avif" alt="Dish 2">
    <img src="salad.jpeg" alt="Dish 3">
    <img src="popon.jpg" alt="Dish 4">
    <img src="momos.jpeg" alt="Dish 5">
  </div>

  <script>
    let currentIndex = 0;
    const images = document.querySelectorAll('.carousel img');
    const nextButton = document.querySelector('.next');
    const prevButton = document.querySelector('.prev');

    // Show the next image
    nextButton.addEventListener('click', () => {
      images[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % images.length;
      images[currentIndex].classList.add('active');
    });

    // Show the previous image
    prevButton.addEventListener('click', () => {
      images[currentIndex].classList.remove('active');
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      images[currentIndex].classList.add('active');
    });
  </script>

</body>
</html>
