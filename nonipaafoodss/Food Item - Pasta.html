<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Website Navbar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    
.protofile {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 20px;
}

.protofile .inbox {
  height: 80px;
  width: 80px;
  border: 2px solid #fff;
  border-radius: 50%;
  overflow: hidden;
  margin-bottom: 10px;
}

.protofile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.heading {
  text-align: center;
}
    /* Navbar container */
    .navbar {
      position: fixed;
      left: 0;
      top: 0;
      width: 200px;
      height: 100vh;
      background-color: #fff;
      border-right: 1px solid #ddd;
      box-shadow: 2px 0px 5px rgba(0, 0, 0, 0.1);
      padding: 20px 0;
    }

    /* Navbar items */
    .navbar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .navbar ul li {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      cursor: pointer;
      color: #333;
      transition: all 0.3s;
    }

    /* Icons and text alignment */
    .navbar ul li i {
      margin-right: 10px;
      font-size: 18px;
    }

    /* Hover effect */
    .navbar ul li:hover {
      background-color: #ffcc80;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="protofile">
    <div class="inbox">
        <img src="Orange and Blue Illustrative Circle Food Logo.png" alt="profile-pic">
    </div>
    <div class="heading">
        <h3 class="title">Nihal Raza</h3>
        <h4 class="label">Frontend Developer</h4>
    </div>
</div>
    <ul>
      <li><i class="fas fa-home"></i> Home</li>
      <li><i class="fas fa-info-circle"></i> About</li>
      <li><i class="fas fa-fire"></i> Trending</li>
      <li><i class="fas fa-utensils"></i> Food Category</li>
      <li><i class="fas fa-glass-martini-alt"></i> Juice</li>
      <li><i class="fas fa-phone-alt"></i> Contact</li>
    </ul>
  </div>

</body>
</html>
