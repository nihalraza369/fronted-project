<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonipaa Food</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <div class="navbar">
        <div class="protofile">
            <div class="inbox">
                <img src="Orange and Blue Illustrative Circle Food Logo.png" alt="profile-pic">
            </div>
            <div class="heading">
                <h3 class="title">Nihal Raza</h3>
                <h4 class="label">Frontend Developer</h4>
            </div>
        </div>
        <ul>
            <li><a href="#home"><i class="uil uil-estate"></i><span>Home</span></a></li>
            <li><a href="#about"><i class="uil uil-user"></i><span>About</span></a></li>
            <li><a href="#profile"><i class="uil uil-user-circle"></i><span>Profile</span></a></li>
            <li><a href="#experience"><i class="uil uil-suitcase"></i><span>My Experience</span></a></li>
            <li><a href="#work"><i class="uil uil-briefcase"></i><span>My Work</span></a></li>
            <li><a href="#contact"><i class="uil uil-phone-volume"></i><span>Contact</span></a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="search-bar">
            <input type="text" placeholder="Search here...">
            <button>Search</button>
        </div>

        <div class="promo-banner">
            <img src="Yellow and Brown Modern Travel SEEK Cover Image.png" alt="50% Discount">
        </div>

        <section class="food-container">
            <div class="food-box">
              <img src="pasta.jpg" alt="Pasta">
            </div>
            <div class="food-box">
              <img src="nudle.avif" alt="Noodles">
            </div>
            <div class="food-box">
              <img src="soup.jpg" alt="Burger">
            </div>
            <div class="food-box">
              <img src="salad.jpeg" alt="Pizza">
            </div>
            <div class="food-box">
              <img src="momos.jpeg" alt="Sushi">
            </div>
            <div class="food-box">
              <img src="fries.webp" alt="Salad">
            </div>
            <div class="food-box">
              <img src="20211122 Japanese Curry LEDE.webp" alt="Tacos">
            </div>
            <div class="food-box">
              <img src="butte.jpg" alt="Steak">
            </div>
            <div class="food-box">
              <img src="popon.jpg" alt="Ice Cream">
            </div>
            <div class="food-box">
              <img src="icecream.jpg" alt="Dessert">
            </div>
            <div class="food-box">
              <img src="limca.jpg" alt="Fries">
            </div>
            <div class="food-box">
              <img src="juice.jpeg" alt="Sandwich">
            </div>
          </section>
          

</body>
</html>
